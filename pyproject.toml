[build-system]
requires = ['flit_core >=3.4,<4']
build-backend = 'flit_core.buildapi'

[project]
name = 'reax'
dynamic = ["version", "description"]
authors = [
    { name = 'Martin Uhrin', email = 'martin.uhrin.10@ucl.ac.uk' },
]
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = 'LICENSE.txt' }
classifiers = [
    'Development Status :: 4 - Beta',
    'License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
keywords = ['machine learning', 'jax', 'research']
requires-python = '>=3.10'
dependencies = [
    'beartype',
    "einops",
    "equinox",
    "flax",
    'fsspec',
    'jax',
    'jaxlib',
    'jaxtyping',
    'lightning-utilities>=0.10.0',
    "optax",
    'pytray',
    "stevedore",
    "tensorboardX",
    "tqdm",
    "typing-extensions",
]

[project.urls]
Home = 'https://github.com/camml-lab/reax'
Source = 'https://github.com/camml-lab/reax'

[project.optional-dependencies]
docs = [
    'docutils',
    'jupyter', # For running doc examples
    'myst-nb', # Jupyter notebooks in docs
    'pandoc',
    "pydata_sphinx_theme",
    "scikit-learn",
    'sphinx',
    'sphinx-autobuild',
]
dev = [
    'cloudpickle',
    'flit',
    'ipython',
    "mlflow<3.7",
    "omegaconf",
    'pandas',
    'pytest',
    'pytest-cov',
    'pytest-env',
    'pytest-timeout',
    'pre-commit',
    'pylint',
    'ruff',
    'ty==0.0.84',
]
examples = [
    "lightning",
    "pillow",
    "torch",
]

[tool.flit.module]
name = 'reax'

[tool.flit.sdist]
exclude = [
    '.github/',
    'docs/',
    'examples/',
]

[project.entry-points."reax.plugins.metrics"]
mean = "reax.metrics:Average"
min = "reax.metrics:Min"
max = "reax.metrics:Max"
num_unique = "reax.metrics:NumUnique"
unique = "reax.metrics:Unique"
std = "reax.metrics:Std"
sum = "reax.metrics:Sum"
mse = "reax.metrics:MeanSquaredError"
rmse = "reax.metrics:RootMeanSquareError"
mae = "reax.metrics:MeanAbsoluteError"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    'migrations',
]

[tool.ruff.lint]
select = [
    'B',
    'B9',
    'C90',
    'E',
    'F',
    'I',
    'S',
    'UP',
    'W',
]
ignore = [
    'E203',
    'E266',
    'F403',
    'F722',
    'F821',
    'S101',
    'S603',
    'S607',
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
'src/reax/lightning/*.py' = [
    'C90',
]

[tool.ty.src]
# TODO: These files have outstanding ty errors, remove them from this list as they are fixed
exclude = [
    'docs/source/get_started/introduction.ipynb',
    'docs/source/get_started/quick_start.ipynb',
    'examples/autoencoder.py',
    'src/reax/data/_datasource_manager.py',
    'src/reax/data/_loaders.py',
    'src/reax/data/_types.py',
    'src/reax/data/collate.py',
    'src/reax/data/datamodules.py',
    'src/reax/data/datasets.py',
    'src/reax/data/fetchers.py',
    'src/reax/data/samplers.py',
    'src/reax/data/utils.py',
    'src/reax/demos/boring_classes.py',
    'src/reax/demos/mnist.py',
    'src/reax/listeners/early_stopping.py',
    'src/reax/listeners/model_checkpoint.py',
    'src/reax/listeners/progress/tqdm_progress.py',
    'src/reax/loggers/_utils.py',
    'src/reax/loggers/csv_logs.py',
    'src/reax/loggers/logger.py',
    'src/reax/loggers/mlflow.py',
    'src/reax/loggers/pandas.py',
    'src/reax/loggers/tensorboard.py',
    'src/reax/modules.py',
    'src/reax/optimizers.py',
    'src/reax/random.py',
    'src/reax/results.py',
    'src/reax/strategies/_factory.py',
    'src/reax/strategies/_jax.py',
    'src/reax/strategies/_parallel.py',
    'src/reax/training/trainer.py',
    'src/reax/utils/arrays.py',
    'src/reax/utils/containers.py',
    'src/reax/utils/events.py',
    'tests/checkpointing/test_checkpoint_callback_frequency.py',
    'tests/core/test_module.py',
    'tests/core/todo_test_module.py',
    'tests/data/test_collate.py',
    'tests/data/test_datamodules_and_manager.py',
    'tests/data/test_datasets.py',
    'tests/data/test_fetchers.py',
    'tests/data/test_kfold.py',
    'tests/data/test_kfold_distributed.py',
    'tests/data/test_loaders.py',
    'tests/data/test_samplers.py',
    'tests/data/test_utils.py',
    'tests/engine/test_engine_ddp.py',
    'tests/helpers/simple_models.py',
    'tests/listeners/progress/test_rich_progress_bar.py',
    'tests/listeners/test_early_stopping.py',
    'tests/listeners/test_listeners.py',
    'tests/listeners/test_model_checkpoint.py',
    'tests/loggers/conftest.py',
    'tests/loggers/test_mlflow.py',
    'tests/loggers/test_pandas.py',
    'tests/loggers/test_tensorboard.py',
    'tests/models/test_hooks.py',
    'tests/profilers/test_jax_profiler.py',
    'tests/stages/test_timer.py',
    'tests/strategies/test_parallel_strategy.py',
    'tests/test_metrics.py',
    'tests/training/test_dataloaders.py',
    'tests/training/test_trainer.py',
    'tests/utils/test_arrays.py',
    'tests/utils/test_containers.py',
]

[tool.pylint.MASTER]
ignore-paths = '^src/reax/lightning/.*$'  # These are copy-paste from lightning, so don't lint

[tool.pylint.format]
max-line-length = 100
max-module-lines = 1200

[tool.pylint.messages_control]
disable = [
    # Unfortunately, jaxtyping decorator creates a function that seems to mistakenly be identified as
    # not returning anything, so we have to disable the error below for now
    'assignment-from-no-return',
    'duplicate-code',
    'import-outside-toplevel',
    'missing-docstring',
    'locally-disabled',
    'too-few-public-methods',
    'too-many-arguments',
    'too-many-instance-attributes',
    'use-dict-literal',
    'fixme',
]

[tool.pylint.design]
max-locals = 22
max-branches = 14
max-returns = 8
max-positional-arguments = 10
max-public-methods = 22

[tool.doc8]
max-line-length = 100

[tool.docformatter]
wrap-summaries = 100
wrap-descriptions = 100

[pytest]
log_cli = "True"
log_cli_level = "DEBUG"

[tool.pytest_env]
XLA_PYTHON_CLIENT_PREALLOCATE = false # Don't allow JAX to preallocate memory
JAX_PLATFORMS = "cpu" # Force tests to run on the CPU

[tool.pytest.ini_options]
minversion = '6.0'
testpaths = [
    'tests',
]
filterwarnings = [
    'ignore::DeprecationWarning:frozendict:',
]
markers = [
    'multiproc: tests that spawn multiple JAX DDP subprocesses',
]
timeout = 600
timeout_method = 'thread'
#addopts = "--jaxtyping-packages=reax,beartype.beartype"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311

[testenv]
usedevelop = true

[testenv:py{310,311,312,313}]
description = Run the unit tests
extras =
    dev
commands = pytest {posargs}

[testenv:pre-commit]
description = Run the style checks and formatting
extras =
    dev
commands = pre-commit run {posargs}

[pytest]
filterwarnings =
    ignore::DeprecationWarning:distutils:
"""
